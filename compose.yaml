services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      RAG_ENVIRONMENT: production
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_BASE_URL: ${RAG_DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-bge-m3}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_DOCUMENTS_DIR: /knowledge
      RAG_DOCUMENT_SCAN_INTERVAL_SECONDS: ${RAG_DOCUMENT_SCAN_INTERVAL_SECONDS:-60}
      RAG_DOCUMENT_STABLE_SECONDS: ${RAG_DOCUMENT_STABLE_SECONDS:-10}
      RAG_DOCUMENT_MAX_SIZE_MB: ${RAG_DOCUMENT_MAX_SIZE_MB:-25}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/workspace/storage
      - ./data/documents:/knowledge:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  qdrant_data:
  app_storage:
